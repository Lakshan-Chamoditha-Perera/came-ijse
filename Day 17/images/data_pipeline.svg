<title id="t">Part 2 roadmap</title>
<desc id="d">Two rows of steps. Prepare the data: section 2, Create, 1000 customers with 3 features each and a label of 0 or 1; section 3, Split, train 700, validation 150, test 150; section 4, Scale, fit on train only, transform all 3 sets, mean 0 and std 1; section 5, To tensors, float32, features [700, 3], labels [700, 1]; section 6, Mini-batches, 22 batches of 32 rows, shuffled. An arrow then leads to the second row, Build and train the model: section 7, Model, 3 to 8 to 1 with a ReLU hidden layer and 41 parameters; section 8, Loss and optimiser, BCEWithLogitsLoss and AdamW with learning rate 0.001; section 9, Train, 50 epochs and 1100 updates, train accuracy 91.7%, best validation loss 0.147. A dashed box shows the next step, Evaluate: the test set of 150, accuracy and a classification report, and loss curves.</desc>
