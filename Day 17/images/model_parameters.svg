text-anchor="middle">-0.4636</text><rect class="c-s2w" x="316" y="340" width="62" height="24" rx="3"/><text class="cell-text t1" x="347" y="356" text-anchor="middle">-0.5333</text><rect class="c-s2w" x="316" y="366" width="62" height="24" rx="3"/><text class="cell-text t1" x="347" y="382" text-anchor="middle">0.5743</text><text class="m" x="96" y="412" text-anchor="start">row i = the 3 weights going into hidden neuron hᵢ  ·  column j = weights coming from input xⱼ</text><text class="h" x="490" y="152" text-anchor="start">Zoom: row 1 + bias 1 = hidden neuron h₁</text><text class="m" x="490" y="171" text-anchor="start">with sample_tensor = [[0.5, 1.0, 2.0]]</text><line class="wline" x1="572" y1="212" x2="780" y2="262"/><line class="wline" x1="572" y1="262" x2="780" y2="262"/><line class="wline" x1="572" y1="312" x2="780" y2="262"/><rect class="pill" x="635.6" y="224.5" width="60" height="20" rx="4"/><text class="code" x="665.6" y="238.5" text-anchor="middle">-0.3095</text><circle class="node c-s1" cx="572" cy="212" r="8"/><text class="s" x="556" y="216" text-anchor="end">x₁ = 0.5</text><rect class="pill" x="635.6" y="252" width="60" height="20" rx="4"/><text class="code" x="665.6" y="266" text-anchor="middle">-0.0098</text><circle class="node c-s1" cx="572" cy="262" r="8"/><text class="s" x="556" y="266" text-anchor="end">x₂ = 1.0</text><rect class="pill" x="635.6" y="279.5" width="60" height="20" rx="4"/><text class="code" x="665.6" y="293.5" text-anchor="middle">0.3581</text><circle class="node c-s1" cx="572" cy="312" r="8"/><text class="s" x="556" y="316" text-anchor="end">x₃ = 2.0</text><circle class="node c-s2" cx="780" cy="262" r="9"/><text class="s" x="796" y="266" text-anchor="start">h₁</text><text class="code" x="780" y="292" text-anchor="middle">bias -0.4767</text><text class="code sm" x="490" y="372" text-anchor="start">z₁ = -0.15475 - 0.0098 + 0.7162 - 0.4767 = 0.07495</text><text class="m" x="490" y="392" text-anchor="start">ReLU(0.07495) = 0.07495: positive, so h₁ passes it on</text><rect class="card" x="24" y="442" width="852" height="150" rx="12"/><text class="h" x="44" y="470" text-anchor="start">Output layer · self.output = nn.Linear(8, 1)</text><text class="m" x="856" y="470" text-anchor="end">8 + 1 = 9 parameters</text><g class="badge"><circle cx="104" cy="498" r="10"/><text x="104" y="502" text-anchor="middle">3</text></g><text class="codeb" x="120" y="502" text-anchor="start">output.weight</text><text class="m" x="224" y="502" text-anchor="start">shape (1, 8)</text><text class="s" x="127" y="526" text-anchor="middle">from h₁</text><rect class="c-s3w" x="96" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="127" y="548" text-anchor="middle">-0.1374</text><text class="s" x="191" y="526" text-anchor="middle">from h₂</text><rect class="c-s3w" x="160" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="191" y="548" text-anchor="middle">0.0876</text><text class="s" x="255" y="526" text-anchor="middle">from h₃</text><rect class="c-s3w" x="224" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="255" y="548" text-anchor="middle">0.2593</text><text class="s" x="319" y="526" text-anchor="middle">from h₄</text><rect class="c-s3w" x="288" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="319" y="548" text-anchor="middle">0.0440</text><text class="s" x="383" y="526" text-anchor="middle">from h₅</text><rect class="c-s3w" x="352" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="383" y="548" text-anchor="middle">0.1790</text><text class="s" x="447" y="526" text-anchor="middle">from h₆</text><rect class="c-s3w" x="416" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="447" y="548" text-anchor="middle">-0.1592</text><text class="s" x="511" y="526" text-anchor="middle">from h₇</text><rect class="c-s3w" x="480" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="511" y="548" text-anchor="middle">0.1401</text><text class="s" x="575" y="526" text-anchor="middle">from h₈</text><rect class="c-s3w" x="544" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="575" y="548" text-anchor="middle">0.0449</text><text class="s" x="86" y="548" text-anchor="end">ŷ</text><g class="badge"><circle cx="648" cy="498" r="10"/><text x="648" y="502" text-anchor="middle">4</text></g><text class="codeb" x="664" y="502" text-anchor="start">output.bias</text><text class="m" x="752" y="502" text-anchor="start">(1,)</text><text class="s" x="671" y="526" text-anchor="middle">bias</text><rect class="c-s3w" x="640" y="532" width="62" height="24" rx="3"/><text class="cell-text t1" x="671" y="548" text-anchor="middle">-0.2337</text><text class="m" x="96" y="578" text-anchor="start">one weight from each hidden neuron into the single output:  ŷ = w₁·h₁ + w₂·h₂ + … + w₈·h₈ + bias</text><text class="s" x="32" y="622" text-anchor="start">Every tensor shows requires_grad=True, so autograd computes a gradient for all 41 numbers and training can adjust them.</text>
</svg>
