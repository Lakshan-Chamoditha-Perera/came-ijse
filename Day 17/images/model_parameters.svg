<svg xmlns="http://www.w3.org/2000/svg" width="900" height="648" viewBox="0 0 900 648" role="img" aria-labelledby="t d">
<title id="t">Model parameters of CustomerPredictor</title>
<desc id="d">The four tensors printed by model.parameters(). 1: hidden.weight, an 8 by 3 grid, one row per hidden neuron and one column per input. 2: hidden.bias, 8 values. Row 1 and bias 1 are highlighted and zoomed: inputs 0.5, 1.0 and 2.0 with weights -0.3095, -0.0098 and 0.3581 plus bias -0.4767 give z1 = 0.07495. 3: output.weight, a 1 by 8 row, one weight from each hidden neuron. 4: output.bias, one value, -0.2337. 41 parameters in total, all with requires_grad=True.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s2-wash: rgba(235,104,52,0.17); --s3-wash: rgba(27,175,122,0.17);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s2-wash: rgba(217,89,38,0.30); --s3-wash: rgba(25,158,112,0.30);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: var(--ink-2); }
  .code.sm { font-size: 11.5px; }
  .codeb { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: var(--ink-1); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .pill { fill: var(--surface); }
  .c-s1 { fill: var(--s1); } .c-s2 { fill: var(--s2); } .c-s2w { fill: var(--s2-wash); } .c-s3w { fill: var(--s3-wash); } .c-s3 { fill: var(--s3); }
  .on-s2 { fill: #0b0b0b; } .t1 { fill: var(--ink-1); }
  .cell-text { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
  .wline { stroke: var(--s2); stroke-width: 2; stroke-linecap: round; }
  .node { stroke: var(--surface); stroke-width: 2; }
  .badge circle { fill: var(--ink-2); }
  .badge text { fill: var(--surface); font-size: 11px; font-weight: 700; }
</style>
