<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
<title id="t">Batch versus epoch</title>
<desc id="d">A grid of boxes. Each row is one epoch and holds 22 boxes, one per batch: 21 batches of 32 customers and a narrower last batch of 28. Rows are shown for epochs 1, 2, 3 and 50, with epochs 2 onward marked reshuffled. The first box of epoch 1 is highlighted: 1 batch equals 32 customers and 1 weight update. A brace under a row reads: 1 epoch equals 22 batches equals all 700 customers, once. A brace beside all rows reads: 50 epochs equals 50 times 22 equals 1100 updates. The line to remember: a batch is a piece of the data, an epoch is all of the data once, and the weights change after every batch.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --s1: #2a78d6; --s1-wash: rgba(42,120,214,0.16); --s1-edge: rgba(42,120,214,0.45);
    --s2: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --s1: #3987e5; --s1-wash: rgba(57,135,229,0.26); --s1-edge: rgba(57,135,229,0.60);
      --s2: #d95926;
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 13.5px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 11.5px; fill: var(--ink-3); }
  .k { font-size: 12.5px; fill: var(--ink-1); }
  .kb { font-size: 12.5px; font-weight: 700; fill: var(--ink-1); }
  .box { fill: var(--s1-wash); stroke: var(--s1-edge); stroke-width: 1; }
  .hot { fill: var(--s1); }
  .brace { fill: none; stroke: var(--ink-3); stroke-width: 1.2; }
  .lead { stroke: var(--ink-3); stroke-width: 1; }
  .key { fill: none; stroke: var(--s2); stroke-width: 1.5; }
</style>
