<svg xmlns="http://www.w3.org/2000/svg" width="900" height="696" viewBox="0 0 900 696" role="img" aria-labelledby="t d">
<title id="t">Day 17 roadmap: training a neural network with PyTorch (Part 2 highlighted)</title>
<desc id="d">Roadmap of Day 17 in two parts. Part 2, training the network, is highlighted; the other part is faded. Part 1, Notebook.ipynb, builds the network in three stages: stage 1, set up, section 1 to 2, install PyTorch and check the version and device; stage 2, build, section 3, define the network with nn.Module, 3 to 8 to 1 with a ReLU hidden layer; stage 3, look inside, section 4, tensors, the network's float32 input with shape (1, 3); section 5, parameters, 41 weights and biases learned in training; section 6, run the network, model(x) calls forward() and returns 1 raw score. Part 2, Training_Pipeline.ipynb, trains it in five stages: stage 1, prepare the data, sections 1 to 6: libraries; create 1000 customers with 3 features and a label 0 or 1; split into train 700, validation 150 and test 150; scale, fit on train only; convert to float32 tensors, features (700, 3) and labels (700, 1); 22 shuffled mini-batches of 32 rows. Stage 2, set up, section 7, the model CustomerPredictor with 41 parameters, and section 8, loss BCEWithLogitsLoss and optimiser AdamW with learning rate 0.001. Stage 3, train, section 9, 50 epochs and 1100 weight updates, best validation loss 0.147. Stage 4, evaluate, section 10, 150 test customers, accuracy 92.7%, confusion matrix. Stage 5, use, section 11, predict for a new customer: probability 0.9987, will buy.</desc>
