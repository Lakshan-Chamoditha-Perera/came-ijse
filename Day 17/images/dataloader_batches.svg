<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436" role="img" aria-labelledby="t d">
<title id="t">TensorDataset and DataLoader mini-batches</title>
<desc id="d">Pipeline: the tensors train_features_tensor [700, 3] and train_labels_tensor [700, 1] go into TensorDataset, which pairs each row with its label, (x0, y0) to (x699, y699). DataLoader with batch_size 32 and shuffle True shuffles the 700 pairs and cuts them into batches of 32, and the training loop, for batch_features, batch_labels in train_loader, makes one weight update per batch. Below, one epoch is drawn as a bar of 700 rows split into 22 batches: batches 1 to 21 have 32 rows each, 672 rows in total, and batch 22 has the 28 rows left over. Each batch has batch_features of shape [32, 3] and batch_labels of shape [32, 1]; the last has [28, 3] and [28, 1].</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s1-wash: rgba(42,120,214,0.12); --s2-wash: rgba(235,104,52,0.14); --s3-wash: rgba(27,175,122,0.14);
    --s2-a: rgba(235,104,52,0.30); --s2-b: rgba(235,104,52,0.16);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s1-wash: rgba(57,135,229,0.24); --s2-wash: rgba(217,89,38,0.26); --s3-wash: rgba(25,158,112,0.26);
      --s2-a: rgba(217,89,38,0.55); --s2-b: rgba(217,89,38,0.30);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: var(--ink-1); }
  .codeb { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: var(--ink-1); }
  .num { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; fill: var(--ink-1); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .w1 { fill: var(--s1-wash); } .w2 { fill: var(--s2-wash); } .w3 { fill: var(--s3-wash); }
  .e1 { fill: var(--s1); } .e2 { fill: var(--s2); } .e3 { fill: var(--s3); }
  .cell { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .seg-a { fill: var(--s2-a); } .seg-b { fill: var(--s2-b); }
  .arrow { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .arrowhead { fill: var(--ink-3); }
  .brace { fill: none; stroke: var(--ink-3); stroke-width: 1; }
  .step { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="435" rx="12"/>
<text class="title" x="32" y="44" text-anchor="start">TensorDataset + DataLoader: 700 rows → 22 mini-batches per epoch</text><text class="s" x="32" y="67" text-anchor="start">batch_size=32, shuffle=True · the training loop gets one batch at a time and updates the weights after each one</text><rect class="card" x="32" y="92" width="184" height="112" rx="8"/><rect class="w1" x="32" y="92" width="184" height="112" rx="8"/><rect class="e1" x="32" y="100" width="4" height="96" rx="2"/><text class="h" x="50" y="118" text-anchor="start">Tensors</text><text class="num" x="50" y="141" text-anchor="start">train_features_tensor</text><text class="m" x="50" y="156" text-anchor="start">[700, 3]</text><text class="num" x="50" y="176" text-anchor="start">train_labels_tensor</text><text class="m" x="50" y="191" text-anchor="start">[700, 1]</text><rect class="card" x="249" y="92" width="184" height="112" rx="8"/><rect class="w3" x="249" y="92" width="184" height="112" rx="8"/><rect class="e3" x="249" y="100" width="4" height="96" rx="2"/><text class="h" x="267" y="118" text-anchor="start">TensorDataset</text><text class="m" x="267" y="140" text-anchor="start">pairs each row with its label</text><text class="s" x="267" y="166" text-anchor="start">(x₀, y₀), (x₁, y₁), …</text><text class="s" x="267" y="186" text-anchor="start">… (x₆₉₉, y₆₉₉)</text><rect class="card" x="466" y="92" width="184" height="112" rx="8"/><rect class="w3" x="466" y="92" width="184" height="112" rx="8"/><rect class="e3" x="466" y="100" width="4" height="96" rx="2"/><text class="h" x="484" y="118" text-anchor="start">DataLoader</text><text class="s" x="484" y="146" text-anchor="start"><tspan class="step">①</tspan> shuffles the 700 pairs</text><text class="s" x="484" y="170" text-anchor="start"><tspan class="step">②</tspan> cuts them into</text><text class="s" x="504" y="188" text-anchor="start">batches of 32</text><rect class="card" x="683" y="92" width="184" height="112" rx="8"/><rect class="w2" x="683" y="92" width="184" height="112" rx="8"/><rect class="e2" x="683" y="100" width="4" height="96" rx="2"/><text class="h" x="701" y="118" text-anchor="start">Training loop</text><text class="code" x="701" y="140" text-anchor="start">for batch_features,</text><text class="code" x="717" y="156" text-anchor="start">batch_labels</text><text class="code" x="701" y="172" text-anchor="start">in train_loader:</text><text class="m" x="701" y="192" text-anchor="start">1 weight update per batch</text><line class="arrow" x1="220" y1="148" x2="238" y2="148"/><path class="arrowhead" d="M245 148 l-8 -4.5 v9 z"/><line class="arrow" x1="437" y1="148" x2="455" y2="148"/><path class="arrowhead" d="M462 148 l-8 -4.5 v9 z"/><line class="arrow" x1="654" y1="148" x2="672" y2="148"/><path class="arrowhead" d="M679 148 l-8 -4.5 v9 z"/><text class="h" x="32" y="250" text-anchor="start">One epoch = one pass over all 700 rows</text><text class="m" x="32" y="302" text-anchor="start">700 rows</text><rect class="seg-a" x="96" y="280" width="32" height="34"/><text class="num" x="112" y="301" text-anchor="middle">1</text><rect class="seg-b" x="128" y="280" width="32" height="34"/><text class="num" x="144" y="301" text-anchor="middle">2</text><rect class="seg-a" x="160" y="280" width="32" height="34"/><text class="num" x="176" y="301" text-anchor="middle">3</text><rect class="seg-b" x="192" y="280" width="32" height="34"/><text class="num" x="208" y="301" text-anchor="middle">4</text><rect class="seg-a" x="224" y="280" width="32" height="34"/><text class="num" x="240" y="301" text-anchor="middle">5</text><rect class="seg-b" x="256" y="280" width="32" height="34"/><text class="num" x="272" y="301" text-anchor="middle">6</text><rect class="seg-a" x="288" y="280" width="32" height="34"/><text class="num" x="304" y="301" text-anchor="middle">7</text><rect class="seg-b" x="320" y="280" width="32" height="34"/><text class="num" x="336" y="301" text-anchor="middle">8</text><rect class="seg-a" x="352" y="280" width="32" height="34"/><text class="num" x="368" y="301" text-anchor="middle">9</text><rect class="seg-b" x="384" y="280" width="32" height="34"/><text class="num" x="400" y="301" text-anchor="middle">10</text><rect class="seg-a" x="416" y="280" width="32" height="34"/><text class="num" x="432" y="301" text-anchor="middle">11</text><rect class="seg-b" x="448" y="280" width="32" height="34"/><text class="num" x="464" y="301" text-anchor="middle">12</text><rect class="seg-a" x="480" y="280" width="32" height="34"/><text class="num" x="496" y="301" text-anchor="middle">13</text><rect class="seg-b" x="512" y="280" width="32" height="34"/><text class="num" x="528" y="301" text-anchor="middle">14</text><rect class="seg-a" x="544" y="280" width="32" height="34"/><text class="num" x="560" y="301" text-anchor="middle">15</text><rect class="seg-b" x="576" y="280" width="32" height="34"/><text class="num" x="592" y="301" text-anchor="middle">16</text><rect class="seg-a" x="608" y="280" width="32" height="34"/><text class="num" x="624" y="301" text-anchor="middle">17</text><rect class="seg-b" x="640" y="280" width="32" height="34"/><text class="num" x="656" y="301" text-anchor="middle">18</text><rect class="seg-a" x="672" y="280" width="32" height="34"/><text class="num" x="688" y="301" text-anchor="middle">19</text><rect class="seg-b" x="704" y="280" width="32" height="34"/><text class="num" x="720" y="301" text-anchor="middle">20</text><rect class="seg-a" x="736" y="280" width="32" height="34"/><text class="num" x="752" y="301" text-anchor="middle">21</text><rect class="seg-b" x="768" y="280" width="28" height="34"/><text class="num" x="782" y="301" text-anchor="middle">22</text><text class="m" x="806" y="302" text-anchor="start">→ 22 batches</text><path class="brace" d="M97 320 v6 H767 v-6 M432 326 v6"/><text class="m" x="432" y="348" text-anchor="middle">batches 1–21: 32 rows each = 672 rows</text><path class="brace" d="M769 320 v6 H795 v-6 M782 326 v6"/><text class="m" x="796" y="364" text-anchor="end">batch 22: the 28 rows left over</text><text class="s" x="32" y="400" text-anchor="start">shuffle=True: the rows are mixed again at the start of every epoch, so each batch holds different customers each time.</text><text class="s" x="32" y="422" text-anchor="start">Each batch: batch_features → [32, 3], batch_labels → [32, 1] (the last one: [28, 3] and [28, 1]).</text>
</svg>
