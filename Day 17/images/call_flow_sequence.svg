<text class="title" x="32" y="44" text-anchor="start">What runs when you call model(sample_tensor)</text><text class="s" x="32" y="67" text-anchor="start">The exact methods, in order (torch 2.14.1). Indent = how deep in the call stack. Values return back up the same path.</text><rect class="card" x="24" y="86" width="852" height="36" rx="10"/><text class="h" x="40" y="109" text-anchor="start">Colour key</text><rect class="f1" x="128" y="99" width="14" height="14" rx="3"/><text class="k" x="148" y="111" text-anchor="start">Your code</text><rect class="f2" x="228.95" y="99" width="14" height="14" rx="3"/><text class="k" x="248.95" y="111" text-anchor="start">Inherited from nn.Module</text><rect class="f3" x="428.15" y="99" width="14" height="14" rx="3"/><text class="k" x="448.15" y="111" text-anchor="start">nn.Linear's own method</text><rect class="f0" x="614.25" y="99" width="14" height="14" rx="3"/><text class="k" x="634.25" y="111" text-anchor="start">C++ built-in (not Python)</text><path class="guide" d="M44 188 V217"/><path class="guide" d="M44 217 H58"/><path class="guide" d="M70 238 V267"/><path class="guide" d="M70 267 H84"/><path class="guide" d="M96 288 V317"/><path class="guide" d="M96 317 H110"/><path class="guide" d="M122 338 V617"/><path class="guide" d="M122 367 H136"/><path class="guide" d="M122 417 H136"/><path class="guide" d="M122 567 H136"/><path class="guide" d="M122 617 H136"/><path class="guide" d="M148 438 V467"/><path class="guide" d="M148 467 H162"/><path class="guide" d="M174 488 V517"/><path class="guide" d="M174 517 H188"/><rect class="card" x="32" y="146" width="836" height="42" rx="8"/><rect class="w1" x="32" y="146" width="836" height="42" rx="8"/><rect class="f1" x="32" y="146" width="6" height="42" rx="3"/><text class="codeb" x="48" y="163" text-anchor="start">model(sample_tensor)</text><text class="m" x="48" y="180" text-anchor="start">your notebook cell: Python runs type(model).__call__(model, sample_tensor)</text><text class="m" x="856" y="163" text-anchor="end">1</text><rect class="card" x="58" y="196" width="810" height="42" rx="8"/><rect class="w2" x="58" y="196" width="810" height="42" rx="8"/><rect class="f2" x="58" y="196" width="6" height="42" rx="3"/><text class="codeb" x="74" y="213" text-anchor="start">nn.Module.__call__   (= _wrapped_call_impl)</text><text class="m" x="74" y="230" text-anchor="start">inherited: CustomerPredictor has no __call__, so Python uses the parent's</text><text class="m" x="856" y="213" text-anchor="end">2</text><rect class="card" x="84" y="246" width="784" height="42" rx="8"/><rect class="w2" x="84" y="246" width="784" height="42" rx="8"/><rect class="f2" x="84" y="246" width="6" height="42" rx="3"/><text class="codeb" x="100" y="263" text-anchor="start">nn.Module._call_impl</text><text class="m" x="100" y="280" text-anchor="start">inherited: no hooks are registered, so it just calls self.forward(...)</text><text class="m" x="856" y="263" text-anchor="end">3</text><rect class="card" x="110" y="296" width="758" height="42" rx="8"/><rect class="w1" x="110" y="296" width="758" height="42" rx="8"/><rect class="f1" x="110" y="296" width="6" height="42" rx="3"/><text class="codeb" x="126" y="313" text-anchor="start">CustomerPredictor.forward(x)</text><text class="m" x="126" y="330" text-anchor="start">your own method: it overrides the placeholder nn.Module.forward</text><text class="m" x="856" y="313" text-anchor="end">4</text><rect class="card" x="136" y="346" width="732" height="42" rx="8"/><rect class="w2" x="136" y="346" width="732" height="42" rx="8"/><rect class="f2" x="136" y="346" width="6" height="42" rx="3"/><text class="codeb" x="152" y="363" text-anchor="start">nn.Module.__getattr__("hidden")</text><text class="m" x="152" y="380" text-anchor="start">inherited: self.hidden is stored in self._modules, so this method fetches it</text><text class="m" x="856" y="363" text-anchor="end">5</text><rect class="card" x="136" y="396" width="732" height="42" rx="8"/><rect class="w2" x="136" y="396" width="732" height="42" rx="8"/><rect class="f2" x="136" y="396" width="6" height="42" rx="3"/><text class="codeb" x="152" y="413" text-anchor="start">self.hidden(x)  →  nn.Module.__call__  →  _call_impl</text><text class="m" x="152" y="430" text-anchor="start">inherited: nn.Linear has no __call__ either, so the same two nn.Module steps run</text><text class="m" x="856" y="413" text-anchor="end">6</text><rect class="card" x="162" y="446" width="706" height="42" rx="8"/><rect class="w3" x="162" y="446" width="706" height="42" rx="8"/><rect class="f3" x="162" y="446" width="6" height="42" rx="3"/><text class="codeb" x="178" y="463" text-anchor="start">nn.Linear.forward(input)</text><text class="m" x="178" y="480" text-anchor="start">nn.Linear's own method: return F.linear(input, self.weight, self.bias)</text><text class="m" x="856" y="463" text-anchor="end">7</text><rect class="card" x="188" y="496" width="680" height="42" rx="8"/><rect class="w0" x="188" y="496" width="680" height="42" rx="8"/><rect class="f0" x="188" y="496" width="6" height="42" rx="3"/><text class="codeb" x="204" y="513" text-anchor="start">F.linear   (= torch._C._nn.linear)</text><text class="m" x="204" y="530" text-anchor="start">C++: bias + input @ weight.T in one addmm step  →  logits (1, 8)</text><text class="m" x="856" y="513" text-anchor="end">8</text><rect class="card" x="136" y="546" width="732" height="42" rx="8"/><rect class="w0" x="136" y="546" width="732" height="42" rx="8"/><rect class="f0" x="136" y="546" width="6" height="42" rx="3"/><text class="codeb" x="152" y="563" text-anchor="start">torch.relu(logits)</text><text class="m" x="152" y="580" text-anchor="start">C++: max(0, z) on every value  →  (1, 8)</text><text class="m" x="856" y="563" text-anchor="end">9</text><rect class="card" x="136" y="596" width="732" height="42" rx="8"/><rect class="w2" x="136" y="596" width="732" height="42" rx="8"/><rect class="f2" x="136" y="596" width="6" height="42" rx="3"/><text class="codeb" x="152" y="613" text-anchor="start">self.output(x)</text><text class="m" x="152" y="630" text-anchor="start">repeats the 4 steps above (__getattr__, __call__ → _call_impl, Linear.forward, F.linear)  →  (1, 1)</text><text class="m" x="856" y="613" text-anchor="end">10</text><rect class="card" x="32" y="646" width="836" height="42" rx="8"/><rect class="w1" x="32" y="646" width="836" height="42" rx="8"/><rect class="f1" x="32" y="646" width="6" height="42" rx="3"/><text class="codeb" x="48" y="663" text-anchor="start">returns  tensor([[-0.2154]], grad_fn=&lt;AddmmBackward0&gt;)</text><text class="m" x="48" y="680" text-anchor="start">each method hands its result back to the one that called it, up to your cell</text><text class="m" x="856" y="663" text-anchor="end">11</text><text class="s" x="32" y="730" text-anchor="start">Rule: Python finds a method in the object's own class first, then in its parent class. __call__ always comes from nn.Module; forward from the child.</text>
</svg>
