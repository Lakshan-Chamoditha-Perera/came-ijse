<svg xmlns="http://www.w3.org/2000/svg" width="900" height="752" viewBox="0 0 900 752" role="img" aria-labelledby="t d">
<title id="t">Call flow of model(sample_tensor)</title>
<desc id="d">Eleven steps. 1 model(sample_tensor) in your cell. 2 nn.Module.__call__, which is _wrapped_call_impl, inherited because CustomerPredictor has no __call__. 3 nn.Module._call_impl calls self.forward. 4 CustomerPredictor.forward, your own method. 5 nn.Module.__getattr__ fetches self.hidden. 6 self.hidden(x) runs nn.Module.__call__ and _call_impl, inherited because nn.Linear has no __call__. 7 nn.Linear.forward, its own method. 8 F.linear, a C++ built-in doing addmm, giving shape 1 by 8. 9 torch.relu in C++. 10 self.output(x) repeats steps 5 to 8, giving shape 1 by 1. 11 the result tensor returns to your cell with grad_fn AddmmBackward0.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781; --guide: #c3c2b7;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s0: #898781;
    --s1-wash: rgba(42,120,214,0.12); --s2-wash: rgba(235,104,52,0.14);
    --s3-wash: rgba(27,175,122,0.14); --s0-wash: rgba(137,135,129,0.16);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
