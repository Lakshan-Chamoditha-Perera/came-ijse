<svg xmlns="http://www.w3.org/2000/svg" width="800" height="416" viewBox="0 0 800 416" role="img" aria-labelledby="t d">
<title id="t">Tensor flow through CustomerPredictor</title>
<desc id="d">Four cards left to right: customer data (age 35, visits 12, spend 2,400) is converted to an input tensor x of shape (1, 3); the hidden layer computes z = x @ W transpose + b with 8 values, and ReLU turns the negative values into 0; the output layer gives one raw score y-hat of shape (1, 1). Below, a training loop: loss compares y-hat with the true value, loss.backward() computes gradients with autograd, and optimizer.step() updates W and b. Numbered badges mark four reasons tensors are needed: numbers only, matrix maths, batches, autograd and GPU.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s1-wash: rgba(42,120,214,0.15); --s2-wash: rgba(235,104,52,0.17);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s1-wash: rgba(57,135,229,0.28); --s2-wash: rgba(217,89,38,0.30);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: var(--ink-2); }
  .op { font-size: 22px; fill: var(--ink-2); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .backing { fill: var(--surface); }
  .arrow { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .arrowhead { fill: var(--ink-3); }
  .c-s1 { fill: var(--s1); } .c-s1w { fill: var(--s1-wash); }
  .c-s2 { fill: var(--s2); } .c-s2w { fill: var(--s2-wash); }
  .c-s3 { fill: var(--s3); } .c-zero { fill: var(--line); }
  .on-s1 { fill: #ffffff; } .on-s2, .on-s3 { fill: #0b0b0b; }
  .t1 { fill: var(--ink-1); } .t3 { fill: var(--ink-3); }
  .cell-text { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .badge circle { fill: var(--ink-2); }
  .badge text { fill: var(--surface); font-size: 11px; font-weight: 700; }
</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="415" rx="12"/>
<text class="title" x="32" y="44">How a tensor flows through CustomerPredictor</text><text class="s" x="32" y="67">Forward pass: data → tensor → layers → prediction. In training, autograd sends gradients back.</text><rect class="card" x="35" y="100" width="150" height="180" rx="10"/><text class="h" x="110" y="126" text-anchor="middle">Customer data</text><text class="m" x="110" y="144" text-anchor="middle">raw values</text><text class="m" x="110" y="264" text-anchor="middle">Python numbers</text><rect class="card" x="215" y="100" width="150" height="180" rx="10"/><text class="h" x="290" y="126" text-anchor="middle">Input tensor x</text><text class="code" x="290" y="144" text-anchor="middle">torch.tensor(...)</text><text class="code" x="290" y="264" text-anchor="middle">float32 · (1, 3)</text><rect class="card" x="395" y="100" width="190" height="180" rx="10"/><text class="h" x="490" y="126" text-anchor="middle">Hidden layer</text><text class="code" x="490" y="144" text-anchor="middle">x @ Wᵀ + b → z</text><text class="code" x="490" y="264" text-anchor="middle">8 values · (1, 8)</text><rect class="card" x="615" y="100" width="150" height="180" rx="10"/><text class="h" x="690" y="126" text-anchor="middle">Output layer</text><text class="m" x="690" y="144" text-anchor="middle">8 → 1 · no activation</text><text class="code" x="690" y="264" text-anchor="middle">(1, 1)</text><text class="s" x="51" y="178" text-anchor="start">age</text><text class="code" x="169" y="178" text-anchor="end">35</text><text class="s" x="51" y="202" text-anchor="start">visits</text><text class="code" x="169" y="202" text-anchor="end">12</text><text class="s" x="51" y="226" text-anchor="start">spend</text><text class="code" x="169" y="226" text-anchor="end">2,400</text><rect class="c-s1" x="234" y="158" width="36" height="32" rx="3"/><text class="cell-text on-s1" x="252" y="178.3" text-anchor="middle" font-size="12">0.5</text><rect class="c-s1" x="272" y="158" width="36" height="32" rx="3"/><text class="cell-text on-s1" x="290" y="178.3" text-anchor="middle" font-size="12">1.0</text><rect class="c-s1" x="310" y="158" width="36" height="32" rx="3"/><text class="cell-text on-s1" x="328" y="178.3" text-anchor="middle" font-size="12">2.0</text><text class="m" x="290" y="212" text-anchor="middle">1 row = 1 customer</text><text class="m" x="290" y="228" text-anchor="middle">3 columns = 3 features</text><rect class="c-s2w" x="411" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="420" y="165.3" text-anchor="middle" font-size="12">+</text><rect class="c-s2w" x="431" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="440" y="165.3" text-anchor="middle" font-size="12">−</text><rect class="c-s2w" x="451" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="460" y="165.3" text-anchor="middle" font-size="12">+</text><rect class="c-s2w" x="471" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="480" y="165.3" text-anchor="middle" font-size="12">−</text><rect class="c-s2w" x="491" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="500" y="165.3" text-anchor="middle" font-size="12">+</text><rect class="c-s2w" x="511" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="520" y="165.3" text-anchor="middle" font-size="12">+</text><rect class="c-s2w" x="531" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="540" y="165.3" text-anchor="middle" font-size="12">−</text><rect class="c-s2w" x="551" y="152" width="18" height="18" rx="3"/><text class="cell-text t1" x="560" y="165.3" text-anchor="middle" font-size="12">+</text><text class="code" x="490" y="190" text-anchor="middle">ReLU ↓ max(0, z)</text><rect class="c-s2" x="411" y="200" width="18" height="18" rx="3"/><text class="cell-text on-s2" x="420" y="213.3" text-anchor="middle" font-size="12">+</text><rect class="c-zero" x="431" y="200" width="18" height="18" rx="3"/><text class="cell-text t3" x="440" y="213.0" text-anchor="middle" font-size="11">0</text><rect class="c-s2" x="451" y="200" width="18" height="18" rx="3"/><text class="cell-text on-s2" x="460" y="213.3" text-anchor="middle" font-size="12">+</text><rect class="c-zero" x="471" y="200" width="18" height="18" rx="3"/><text class="cell-text t3" x="480" y="213.0" text-anchor="middle" font-size="11">0</text><rect class="c-s2" x="491" y="200" width="18" height="18" rx="3"/><text class="cell-text on-s2" x="500" y="213.3" text-anchor="middle" font-size="12">+</text><rect class="c-s2" x="511" y="200" width="18" height="18" rx="3"/><text class="cell-text on-s2" x="520" y="213.3" text-anchor="middle" font-size="12">+</text><rect class="c-zero" x="531" y="200" width="18" height="18" rx="3"/><text class="cell-text t3" x="540" y="213.0" text-anchor="middle" font-size="11">0</text><rect class="c-s2" x="551" y="200" width="18" height="18" rx="3"/><text class="cell-text on-s2" x="560" y="213.3" text-anchor="middle" font-size="12">+</text><text class="m" x="490" y="236" text-anchor="middle">negative values become 0</text><rect class="c-s3" x="670" y="156" width="40" height="40" rx="3"/><text class="cell-text on-s3" x="690" y="182.1" text-anchor="middle" font-size="17">ŷ</text><text class="m" x="690" y="220" text-anchor="middle">one raw score</text><line class="arrow" x1="188" y1="190" x2="205" y2="190"/><path class="arrowhead" d="M212 190 l-8 -4.5 v9 z"/><line class="arrow" x1="368" y1="190" x2="385" y2="190"/><path class="arrowhead" d="M392 190 l-8 -4.5 v9 z"/><line class="arrow" x1="588" y1="190" x2="605" y2="190"/><path class="arrowhead" d="M612 190 l-8 -4.5 v9 z"/><g class="badge"><circle cx="200" cy="172" r="10"/><text x="200" y="176" text-anchor="middle">1</text></g><g class="badge"><circle cx="365" cy="100" r="10"/><text x="365" y="104" text-anchor="middle">3</text></g><g class="badge"><circle cx="585" cy="100" r="10"/><text x="585" y="104" text-anchor="middle">2</text></g><rect class="card" x="615" y="330" width="150" height="44" rx="22"/><text class="h" x="690" y="349" text-anchor="middle">Loss</text><text class="m" x="690" y="366" text-anchor="middle">ŷ vs true value</text><rect class="card" x="395" y="330" width="190" height="44" rx="22"/><text class="code" x="490" y="349" text-anchor="middle">loss.backward()</text><text class="m" x="490" y="366" text-anchor="middle">autograd → gradients</text><line class="arrow" x1="690" y1="283" x2="690" y2="320"/><path class="arrowhead" d="M690 327 l-4.5 -8 h9 z"/><line class="arrow" x1="612" y1="352" x2="595" y2="352"/><path class="arrowhead" d="M588 352 l8 -4.5 v9 z"/><line class="arrow" x1="490" y1="327" x2="490" y2="290"/><path class="arrowhead" d="M490 283 l-4.5 8 h9 z"/><text class="m" x="500" y="310" text-anchor="start">optimizer.step() updates W, b</text><g class="badge"><circle cx="585" cy="330" r="10"/><text x="585" y="334" text-anchor="middle">4</text></g><text class="h" x="35" y="349" text-anchor="start">Training only</text><text class="m" x="35" y="366" text-anchor="start">the loop runs backward</text><g class="badge"><circle cx="45" cy="398" r="10"/><text x="45" y="402" text-anchor="middle">1</text></g><text class="s" x="61" y="402" text-anchor="start">numbers only</text><g class="badge"><circle cx="225" cy="398" r="10"/><text x="225" y="402" text-anchor="middle">2</text></g><text class="s" x="241" y="402" text-anchor="start">matrix maths</text><g class="badge"><circle cx="405" cy="398" r="10"/><text x="405" y="402" text-anchor="middle">3</text></g><text class="s" x="421" y="402" text-anchor="start">batches of rows</text><g class="badge"><circle cx="585" cy="398" r="10"/><text x="585" y="402" text-anchor="middle">4</text></g><text class="s" x="601" y="402" text-anchor="start">autograd + GPU</text>
</svg>
