width="230" height="150" rx="8"/><rect class="e1" x="638" y="100" width="4" height="134" rx="2"/><text class="codeb" x="658" y="116" text-anchor="start">X_train_t</text><text class="m" x="658" y="135" text-anchor="start">tensor · float32 · [700, 3]</text><rect class="cell" x="658" y="150" width="60" height="19" rx="3"/><text class="num" x="688" y="163.5" text-anchor="middle">1.4325</text><rect class="cell" x="722" y="150" width="60" height="19" rx="3"/><text class="num" x="752" y="163.5" text-anchor="middle">-1.5463</text><rect class="cell" x="786" y="150" width="60" height="19" rx="3"/><text class="num" x="816" y="163.5" text-anchor="middle">1.2566</text><rect class="cell" x="658" y="172" width="60" height="19" rx="3"/><text class="num" x="688" y="185.5" text-anchor="middle">0.4918</text><rect class="cell" x="722" y="172" width="60" height="19" rx="3"/><text class="num" x="752" y="185.5" text-anchor="middle">-0.2542</text><rect class="cell" x="786" y="172" width="60" height="19" rx="3"/><text class="num" x="816" y="185.5" text-anchor="middle">-0.6759</text><rect class="cell" x="658" y="194" width="60" height="19" rx="3"/><text class="num" x="688" y="207.5" text-anchor="middle">0.7031</text><rect class="cell" x="722" y="194" width="60" height="19" rx="3"/><text class="num" x="752" y="207.5" text-anchor="middle">0.2216</text><rect class="cell" x="786" y="194" width="60" height="19" rx="3"/><text class="num" x="816" y="207.5" text-anchor="middle">-0.3450</text><text class="m" x="754" y="228" text-anchor="middle">⋮  700 rows</text><text class="code" x="450" y="155" text-anchor="middle">torch.tensor(…, dtype=torch.float32)</text><line class="arrow" x1="270" y1="167" x2="623" y2="167"/><path class="arrowhead" d="M630 167 l-8 -4.5 v9 z"/><text class="m" x="450" y="189" text-anchor="middle">only the number type changes: float64 → float32</text><rect class="card" x="32" y="266" width="230" height="158" rx="8"/><rect class="w3" x="32" y="266" width="230" height="158" rx="8"/><rect class="e3" x="32" y="274" width="4" height="142" rx="2"/><text class="codeb" x="52" y="290" text-anchor="start">y_train</text><text class="m" x="52" y="309" text-anchor="start">NumPy array · int64 · (700,)</text><rect class="cell" x="52" y="349" width="30" height="22" rx="3"/><text class="num" x="67" y="364" text-anchor="middle">1</text><rect class="cell" x="86" y="349" width="30" height="22" rx="3"/><text class="num" x="101" y="364" text-anchor="middle">0</text><rect class="cell" x="120" y="349" width="30" height="22" rx="3"/><text class="num" x="135" y="364" text-anchor="middle">1</text><rect class="cell" x="154" y="349" width="30" height="22" rx="3"/><text class="num" x="169" y="364" text-anchor="middle">0</text><text class="m" x="192" y="364" text-anchor="start">…</text><text class="m" x="52" y="410" text-anchor="start">1-D: all 700 values in one row</text><rect class="card" x="638" y="266" width="230" height="158" rx="8"/><rect class="w3" x="638" y="266" width="230" height="158" rx="8"/><rect class="e3" x="638" y="274" width="4" height="142" rx="2"/><text class="codeb" x="658" y="290" text-anchor="start">y_train_t</text><text class="m" x="658" y="309" text-anchor="start">tensor · float32 · [700, 1]</text><rect class="cell" x="658" y="322" width="40" height="18" rx="3"/><text class="num" x="678" y="335" text-anchor="middle">1.</text><rect class="cell" x="658" y="342" width="40" height="18" rx="3"/><text class="num" x="678" y="355" text-anchor="middle">0.</text><rect class="cell" x="658" y="362" width="40" height="18" rx="3"/><text class="num" x="678" y="375" text-anchor="middle">1.</text><rect class="cell" x="658" y="382" width="40" height="18" rx="3"/><text class="num" x="678" y="395" text-anchor="middle">0.</text><text class="m" x="678" y="414" text-anchor="middle">⋮</text><text class="m" x="714" y="348" text-anchor="start">2-D: 700 rows,</text><text class="m" x="714" y="365" text-anchor="start">1 column</text><text class="m" x="714" y="382" text-anchor="start">= one label per row</text><text class="code" x="450" y="315" text-anchor="middle">torch.tensor(…, dtype=torch.float32)</text><text class="code" x="450" y="333" text-anchor="middle">.view(-1, 1)</text><line class="arrow" x1="270" y1="345" x2="623" y2="345"/><path class="arrowhead" d="M630 345 l-8 -4.5 v9 z"/><text class="m" x="450" y="367" text-anchor="middle">-1 = “work it out”: 700 values ÷ 1 column = 700 rows</text><text class="s" x="32" y="452" text-anchor="start">The validation and test sets get the same conversion: X → [150, 3], y → [150, 1].</text>
</svg>
