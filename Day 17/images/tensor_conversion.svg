<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
<title id="t">Converting NumPy arrays to PyTorch tensors</title>
<desc id="d">Top row: X_train_scaled, a NumPy float64 array of shape (700, 3), goes through torch.tensor with dtype float32 and becomes X_train_t, a float32 tensor of shape [700, 3] with the same values (first row 1.4325, -1.5463, 1.2566). Bottom row: y_train, a 1-D NumPy int64 array of 700 labels (1, 0, 1, 0, ...), goes through torch.tensor with dtype float32 and then .view(-1, 1), and becomes y_train_t, a float32 tensor of shape [700, 1]: a single column with one label per row. The validation and test sets are converted the same way, to [150, 3] and [150, 1].</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s1-wash: rgba(42,120,214,0.12); --s2-wash: rgba(235,104,52,0.14); --s3-wash: rgba(27,175,122,0.14);
    --s2-a: rgba(235,104,52,0.30); --s2-b: rgba(235,104,52,0.16);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s1-wash: rgba(57,135,229,0.24); --s2-wash: rgba(217,89,38,0.26); --s3-wash: rgba(25,158,112,0.26);
      --s2-a: rgba(217,89,38,0.55); --s2-b: rgba(217,89,38,0.30);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: var(--ink-1); }
  .codeb { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: var(--ink-1); }
  .num { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11px; fill: var(--ink-1); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .w1 { fill: var(--s1-wash); } .w2 { fill: var(--s2-wash); } .w3 { fill: var(--s3-wash); }
  .e1 { fill: var(--s1); } .e2 { fill: var(--s2); } .e3 { fill: var(--s3); }
  .cell { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .seg-a { fill: var(--s2-a); } .seg-b { fill: var(--s2-b); }
  .arrow { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .arrowhead { fill: var(--ink-3); }
  .brace { fill: none; stroke: var(--ink-3); stroke-width: 1; }
  .step { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; }
</style>
