<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="t d">
<title id="t">One customer must still be a 2D table</title>
<desc id="d">Three panels. A 1D input with shape (3,) is a flat list of the numbers 1, 2, 3 with no rows or columns, so it is unclear whether it is 1 customer with 3 features or 3 customers with 1 feature. After double brackets or reshape(1, -1) it becomes a 2D table with shape (1, 3): 1 row is 1 customer and 3 columns are the 3 features. The test set has the same layout with 150 rows, shape (150, 3). A table below compares the two shapes: feature_scaler.transform fails on 1D with "Expected 2D array" and works on 2D; model() runs on 1D but returns shape (1,) without the batch dimension, and returns (1, 1) on 2D; a layer such as nn.BatchNorm1d fails on 1D with "expected 2D or 3D input" and works on 2D.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9; --grid: #eeede8;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --tint: #cde2fb; --solid: #2a78d6;
    --good: #0ca30c; --bad: #d03b3b; --warn: #c98500;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f; --grid: #2a2a27;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --tint: #1d3a5f; --solid: #3987e5;
      --good: #0ca30c; --bad: #e66767; --warn: #fab219;
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .panel { fill: none; stroke: var(--line); stroke-width: 1; }
  .rule { stroke: var(--line); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 15px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 11.5px; fill: var(--ink-3); }
  .th { font-size: 12px; font-weight: 600; fill: var(--ink-2); }
  .code { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12.5px; fill: var(--ink-1); }
  .c-flat { fill: var(--grid); }
  .c-table { fill: var(--tint); }
  .n { font-size: 18px; font-weight: 700; fill: var(--ink-1); }
  .arrow { stroke: var(--ink-3); stroke-width: 2; fill: none; }
  .arrow-head { fill: var(--ink-3); }
  .ok { fill: var(--good); font-weight: 700; font-size: 14px; }
  .no { fill: var(--bad); font-weight: 700; font-size: 14px; }
  .warn { fill: var(--warn); font-weight: 700; font-size: 14px; }
  .cell { font-size: 13px; fill: var(--ink-1); }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="509" rx="12"/>
<text class="title" x="32" y="44">One customer must still be a table: shape (1, 3), not (3,)</text>
<text class="s" x="32" y="68">Rows = customers, columns = features. The scaler, the model and the test set all use this 2D layout.</text>

<!-- Panel A: 1D -->
<rect class="panel" x="24" y="92" width="268" height="220" rx="10"/>
<text class="h" x="42" y="122">1D: shape (3,)</text>
<text class="s" x="42" y="142">a flat list of 3 numbers</text>
<rect class="c-flat" x="58" y="174" width="56" height="44" rx="4"/><text class="n" x="86" y="202" text-anchor="middle">1</text>
<rect class="c-flat" x="118" y="174" width="56" height="44" rx="4"/><text class="n" x="146" y="202" text-anchor="middle">2</text>
<rect class="c-flat" x="178" y="174" width="56" height="44" rx="4"/><text class="n" x="206" y="202" text-anchor="middle">3</text>
<text class="s" x="42" y="250">No rows, no columns. Is it 1 customer</text>
<text class="s" x="42" y="268">with 3 features, or 3 customers with</text>
<text class="s" x="42" y="286">1 feature each?</text>

<!-- Arrow A -> B -->
<line class="arrow" x1="300" y1="196" x2="336" y2="196"/>
<path class="arrow-head" d="M344 196 L334 190 L334 202 Z"/>

<!-- Panel B: 2D, one row -->
<rect class="panel" x="352" y="92" width="264" height="220" rx="10"/>
<text class="h" x="370" y="122">2D: shape (1, 3)</text>
<text class="s" x="370" y="142">after [[1, 2, 3]] or .reshape(1, -1)</text>
<text class="m" x="460" y="168" text-anchor="middle">feature 1</text>
<text class="m" x="520" y="168" text-anchor="middle">feature 2</text>
<text class="m" x="580" y="168" text-anchor="middle">feature 3</text>
<text class="m" x="426" y="200" text-anchor="end">customer</text>
<rect class="c-table" x="432" y="174" width="56" height="44" rx="4"/><text class="n" x="460" y="202" text-anchor="middle">1</text>
<rect class="c-table" x="492" y="174" width="56" height="44" rx="4"/><text class="n" x="520" y="202" text-anchor="middle">2</text>
<rect class="c-table" x="552" y="174" width="56" height="44" rx="4"/><text class="n" x="580" y="202" text-anchor="middle">3</text>
<text class="s" x="370" y="250">1 row = 1 customer,</text>
<text class="s" x="370" y="268">3 columns = 3 features.</text>
<text class="s" x="370" y="286">Rows come first: (rows, columns).</text>

<!-- Panel C: the test set -->
<rect class="panel" x="632" y="92" width="244" height="220" rx="10"/>
<text class="h" x="650" y="122">Test set: shape (150, 3)</text>
<text class="s" x="650" y="142">the same table, with more rows</text>
<text class="m" x="730" y="168" text-anchor="middle">feature 1</text>
<text class="m" x="788" y="168" text-anchor="middle">feature 2</text>
<text class="m" x="846" y="168" text-anchor="middle">feature 3</text>
<text class="m" x="696" y="192" text-anchor="end">row 1</text>
<rect class="c-table" x="703" y="176" width="54" height="24" rx="3"/>
<rect class="c-table" x="761" y="176" width="54" height="24" rx="3"/>
<rect class="c-table" x="819" y="176" width="54" height="24" rx="3"/>
<text class="m" x="696" y="220" text-anchor="end">row 2</text>
<rect class="c-table" x="703" y="204" width="54" height="24" rx="3"/>
<rect class="c-table" x="761" y="204" width="54" height="24" rx="3"/>
<rect class="c-table" x="819" y="204" width="54" height="24" rx="3"/>
<text class="s" x="788" y="250" text-anchor="middle">⋮</text>
<text class="m" x="696" y="276" text-anchor="end">row 150</text>
<rect class="c-table" x="703" y="260" width="54" height="24" rx="3"/>
<rect class="c-table" x="761" y="260" width="54" height="24" rx="3"/>
<rect class="c-table" x="819" y="260" width="54" height="24" rx="3"/>

<!-- Comparison table -->
<rect class="panel" x="24" y="332" width="852" height="164" rx="10"/>
<text class="h" x="42" y="360">What each step does with the two shapes</text>
<text class="th" x="42" y="390">Step</text>
<text class="th" x="300" y="390">1D input, shape (3,)</text>
<text class="th" x="650" y="390">2D input, shape (1, 3)</text>
<line class="rule" x1="42" y1="400" x2="858" y2="400"/>
<text class="code" x="42" y="422">feature_scaler.transform(...)</text>
<text class="no" x="300" y="422">✗</text><text class="cell" x="318" y="422">ValueError: Expected 2D array</text>
<text class="ok" x="650" y="422">✓</text><text class="cell" x="668" y="422">works</text>
<line class="rule" x1="42" y1="432" x2="858" y2="432"/>
<text class="code" x="42" y="454">model(...)</text>
<text class="warn" x="300" y="454">!</text><text class="cell" x="318" y="454">runs, but returns (1,): no batch dimension</text>
<text class="ok" x="650" y="454">✓</text><text class="cell" x="668" y="454">returns (1, 1), like the test set</text>
<line class="rule" x1="42" y1="464" x2="858" y2="464"/>
<text class="code" x="42" y="486">nn.BatchNorm1d layer</text>
<text class="no" x="300" y="486">✗</text><text class="cell" x="318" y="486">ValueError: expected 2D or 3D input</text>
<text class="ok" x="650" y="486">✓</text><text class="cell" x="668" y="486">works</text>
</svg>
