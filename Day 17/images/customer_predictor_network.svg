<svg xmlns="http://www.w3.org/2000/svg" width="760" height="624" viewBox="0 0 760 624" role="img" aria-labelledby="t d">
<title id="t">CustomerPredictor neural network</title>
<desc id="d">A fully connected network: 3 input features connect to a hidden layer of 8 neurons with ReLU activation, which connects to a single output neuron. 41 trainable parameters in total.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10);
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --edge: #898781; --edge-op: 0.4; --axis: #c3c2b7;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10);
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --edge: #898781; --edge-op: 0.45; --axis: #383835;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: var(--ink-2); }
  .edges line { stroke: var(--edge); stroke-opacity: var(--edge-op); stroke-width: 1; }
  .node circle { stroke: var(--surface); stroke-width: 2; }
  .in circle { fill: var(--s1); }
  .hid circle { fill: var(--s2); }
  .out circle { fill: var(--s3); }
  .axis { fill: none; stroke: var(--axis); stroke-width: 1.5; }
  .arrowhead { fill: var(--axis); }
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="623" rx="12"/>
<text class="title" x="32" y="44">CustomerPredictor network</text>
<text class="s" x="32" y="67">Fully connected 3 → 8 → 1 · 41 trainable parameters</text>
<text class="h" x="170" y="112" text-anchor="middle">Input layer</text><text class="s" x="170" y="131" text-anchor="middle">3 features</text><text class="h" x="380" y="112" text-anchor="middle">Hidden layer</text><text class="s" x="380" y="131" text-anchor="middle">8 neurons · ReLU</text><text class="h" x="590" y="112" text-anchor="middle">Output layer</text><text class="s" x="590" y="131" text-anchor="middle">1 output · no activation</text>
<g class="edges"><line x1="178" y1="244" x2="372" y2="163"/><line x1="178" y1="244" x2="372" y2="209"/><line x1="178" y1="244" x2="372" y2="255"/><line x1="178" y1="244" x2="372" y2="301"/><line x1="178" y1="244" x2="372" y2="347"/><line x1="178" y1="244" x2="372" y2="393"/><line x1="178" y1="244" x2="372" y2="439"/><line x1="178" y1="244" x2="372" y2="485"/><line x1="178" y1="324" x2="372" y2="163"/><line x1="178" y1="324" x2="372" y2="209"/><line x1="178" y1="324" x2="372" y2="255"/><line x1="178" y1="324" x2="372" y2="301"/><line x1="178" y1="324" x2="372" y2="347"/><line x1="178" y1="324" x2="372" y2="393"/><line x1="178" y1="324" x2="372" y2="439"/><line x1="178" y1="324" x2="372" y2="485"/><line x1="178" y1="404" x2="372" y2="163"/><line x1="178" y1="404" x2="372" y2="209"/><line x1="178" y1="404" x2="372" y2="255"/><line x1="178" y1="404" x2="372" y2="301"/><line x1="178" y1="404" x2="372" y2="347"/><line x1="178" y1="404" x2="372" y2="393"/><line x1="178" y1="404" x2="372" y2="439"/><line x1="178" y1="404" x2="372" y2="485"/><line x1="388" y1="163" x2="582" y2="324"/><line x1="388" y1="209" x2="582" y2="324"/><line x1="388" y1="255" x2="582" y2="324"/><line x1="388" y1="301" x2="582" y2="324"/><line x1="388" y1="347" x2="582" y2="324"/><line x1="388" y1="393" x2="582" y2="324"/><line x1="388" y1="439" x2="582" y2="324"/><line x1="388" y1="485" x2="582" y2="324"/></g>
