<text class="s" x="152" y="248" text-anchor="end">x₁</text><text class="s" x="152" y="328" text-anchor="end">x₂</text><text class="s" x="152" y="408" text-anchor="end">x₃</text><text class="s" x="608" y="321">ŷ</text><text class="m" x="608" y="338">prediction</text>
<text class="code" x="275" y="526" text-anchor="middle">self.hidden</text><text class="code" x="275" y="544" text-anchor="middle">nn.Linear(3, 8)</text><text class="m" x="275" y="564" text-anchor="middle">24 weights + 8 biases = 32 params</text><text class="code" x="485" y="526" text-anchor="middle">self.output</text><text class="code" x="485" y="544" text-anchor="middle">nn.Linear(8, 1)</text><text class="m" x="485" y="564" text-anchor="middle">8 weights + 1 bias = 9 params</text>
