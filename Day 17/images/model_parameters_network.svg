<svg xmlns="http://www.w3.org/2000/svg" width="900" height="958" viewBox="0 0 900 958" role="img" aria-labelledby="t d">
<title id="t">CustomerPredictor network with every parameter value</title>
<desc id="d">The 3-8-1 network with all 41 parameter values printed by model.parameters(). Colour key: blue circles are input features, orange circles are hidden neurons, the green circle is the output neuron, grey lines are connections, orange-tinted number tags are hidden-layer weights and biases, and green-tinted number tags are output-layer weights and biases.Each hidden neuron h1 to h8 has a group of 3 hidden.weight values beside it, one at the end of each line from x1, x2 and x3, plus its hidden.bias value. Each of the 8 lines from the hidden neurons to the output carries its output.weight value, and the output has its bias, -0.2337, beside it.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --edge: #898781; --edge-op: 0.5;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s2-wash: rgba(235,104,52,0.20); --s3-wash: rgba(27,175,122,0.22);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --edge: #898781; --edge-op: 0.55;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s2-wash: rgba(217,89,38,0.34); --s3-wash: rgba(25,158,112,0.34);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .codeb { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: var(--ink-1); }
  .num { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 10.5px; fill: var(--ink-1); }
  .edges line { stroke: var(--edge); stroke-opacity: var(--edge-op); stroke-width: 1; }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .k { font-size: 12.5px; fill: var(--ink-2); }
  .kh { font-size: 12.5px; font-weight: 600; fill: var(--ink-1); }
  .backing { fill: var(--surface); }
  .w2 { fill: var(--s2-wash); } .w3 { fill: var(--s3-wash); }
  .node { stroke: var(--surface); stroke-width: 2; }
  .n1 { fill: var(--s1); } .n2 { fill: var(--s2); } .n3 { fill: var(--s3); }
  .lbl-on-dark { fill: #ffffff; font-size: 11px; font-weight: 600; }
  .lbl-on-light { fill: #0b0b0b; font-size: 11px; font-weight: 600; }
  .badge circle { fill: var(--ink-2); }
  .badge text { fill: var(--surface); font-size: 11px; font-weight: 700; }
</style>
