<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" role="img" aria-labelledby="t d">
<title id="t">Tensor ranks: scalar, vector, matrix, 3-D tensor</title>
<desc id="d">Four panels. A scalar is one number with shape []. A vector is a row of 3 numbers with shape [3]. A matrix is a 3 by 3 grid with shape [3, 3]; its first row 0.5, 1.0, 2.0 is highlighted as the sample tensor. A 3-D tensor is three stacked 3 by 3 grids with shape [3, 3, 3].</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s1-wash: rgba(42,120,214,0.15); --s2-wash: rgba(235,104,52,0.17);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s1-wash: rgba(57,135,229,0.28); --s2-wash: rgba(217,89,38,0.30);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: var(--ink-2); }
  .op { font-size: 22px; fill: var(--ink-2); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .backing { fill: var(--surface); }
  .arrow { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .arrowhead { fill: var(--ink-3); }
  .c-s1 { fill: var(--s1); } .c-s1w { fill: var(--s1-wash); }
  .c-s2 { fill: var(--s2); } .c-s2w { fill: var(--s2-wash); }
  .c-s3 { fill: var(--s3); } .c-zero { fill: var(--line); }
  .on-s1 { fill: #ffffff; } .on-s2, .on-s3 { fill: #0b0b0b; }
  .t1 { fill: var(--ink-1); } .t3 { fill: var(--ink-3); }
  .cell-text { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .badge circle { fill: var(--ink-2); }
  .badge text { fill: var(--surface); font-size: 11px; font-weight: 700; }
</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="431" rx="12"/>
<text class="title" x="32" y="44">What is a tensor?</text><text class="s" x="32" y="67">A tensor is a grid of numbers. The number of axes (dimensions) it has is called its rank.</text><rect class="card" x="34" y="92" width="174" height="282" rx="10"/><text class="h" x="121" y="122" text-anchor="middle">Scalar</text><text class="m" x="121" y="141" text-anchor="middle">0-D · rank 0</text><text class="code" x="121" y="324" text-anchor="middle">torch.Size([])</text><text class="m" x="121" y="346" text-anchor="middle">a single number</text><rect class="c-s1w" x="101" y="212" width="40" height="40" rx="3"/><text class="cell-text t1" x="121" y="237.0" text-anchor="middle" font-size="14">5</text><rect class="card" x="220" y="92" width="174" height="282" rx="10"/><text class="h" x="307" y="122" text-anchor="middle">Vector</text><text class="m" x="307" y="141" text-anchor="middle">1-D · rank 1</text><text class="code" x="307" y="324" text-anchor="middle">torch.Size([3])</text><text class="m" x="307" y="346" text-anchor="middle">one customer's 3 features</text><rect class="c-s1w" x="245" y="212" width="40" height="40" rx="3"/><text class="cell-text t1" x="265" y="236.3" text-anchor="middle" font-size="12">0.5</text><rect class="c-s1w" x="287" y="212" width="40" height="40" rx="3"/><text class="cell-text t1" x="307" y="236.3" text-anchor="middle" font-size="12">1.0</text><rect class="c-s1w" x="329" y="212" width="40" height="40" rx="3"/><text class="cell-text t1" x="349" y="236.3" text-anchor="middle" font-size="12">2.0</text><line class="arrow" x1="245" y1="268" x2="362" y2="268"/><path class="arrowhead" d="M369 268 l-8 -4.5 v9 z"/><text class="m" x="307" y="288" text-anchor="middle">3 values along 1 axis</text><rect class="card" x="406" y="92" width="174" height="282" rx="10"/><text class="h" x="493" y="122" text-anchor="middle">Matrix</text><text class="m" x="493" y="141" text-anchor="middle">2-D · rank 2</text><text class="code" x="493" y="324" text-anchor="middle">torch.Size([3, 3])</text><text class="m" x="493" y="346" text-anchor="middle">3 customers × 3 features</text><rect class="c-s1" x="448" y="187" width="34" height="34" rx="3"/><text class="cell-text on-s1" x="465" y="208.1" text-anchor="middle" font-size="11.5">0.5</text><rect class="c-s1" x="484" y="187" width="34" height="34" rx="3"/><text class="cell-text on-s1" x="501" y="208.1" text-anchor="middle" font-size="11.5">1.0</text><rect class="c-s1" x="520" y="187" width="34" height="34" rx="3"/><text class="cell-text on-s1" x="537" y="208.1" text-anchor="middle" font-size="11.5">2.0</text><rect class="c-s1w" x="448" y="223" width="34" height="34" rx="3"/><text class="cell-text t1" x="465" y="244.1" text-anchor="middle" font-size="11.5">1.5</text><rect class="c-s1w" x="484" y="223" width="34" height="34" rx="3"/><text class="cell-text t1" x="501" y="244.1" text-anchor="middle" font-size="11.5">0.2</text><rect class="c-s1w" x="520" y="223" width="34" height="34" rx="3"/><text class="cell-text t1" x="537" y="244.1" text-anchor="middle" font-size="11.5">3.1</text><rect class="c-s1w" x="448" y="259" width="34" height="34" rx="3"/><text class="cell-text t1" x="465" y="280.1" text-anchor="middle" font-size="11.5">0.9</text><rect class="c-s1w" x="484" y="259" width="34" height="34" rx="3"/><text class="cell-text t1" x="501" y="280.1" text-anchor="middle" font-size="11.5">2.4</text><rect class="c-s1w" x="520" y="259" width="34" height="34" rx="3"/><text class="cell-text t1" x="537" y="280.1" text-anchor="middle" font-size="11.5">1.1</text><line class="arrow" x1="448" y1="177" x2="547" y2="177"/><path class="arrowhead" d="M554 177 l-8 -4.5 v9 z"/><text class="m" x="501" y="170" text-anchor="middle">3 features</text><line class="arrow" x1="440" y1="187" x2="440" y2="286"/><path class="arrowhead" d="M440 293 l-4.5 -8 h9 z"/><text class="m" x="434" y="240" text-anchor="middle" transform="rotate(-90 434 240)">3 samples</text><rect class="card" x="592" y="92" width="174" height="282" rx="10"/><text class="h" x="679" y="122" text-anchor="middle">3-D tensor</text><text class="m" x="679" y="141" text-anchor="middle">3-D · rank 3</text><text class="code" x="679" y="324" text-anchor="middle">torch.Size([3, 3, 3])</text><text class="m" x="679" y="346" text-anchor="middle">e.g. an image: C × H × W</text><rect class="backing" x="653" y="178" width="80" height="80" rx="4"/><rect class="c-s1w" x="655" y="180" width="24" height="24" rx="3"/><rect class="c-s1w" x="681" y="180" width="24" height="24" rx="3"/><rect class="c-s1w" x="707" y="180" width="24" height="24" rx="3"/><rect class="c-s1w" x="655" y="206" width="24" height="24" rx="3"/><rect class="c-s1w" x="681" y="206" width="24" height="24" rx="3"/><rect class="c-s1w" x="707" y="206" width="24" height="24" rx="3"/><rect class="c-s1w" x="655" y="232" width="24" height="24" rx="3"/><rect class="c-s1w" x="681" y="232" width="24" height="24" rx="3"/><rect class="c-s1w" x="707" y="232" width="24" height="24" rx="3"/><rect class="backing" x="639" y="192" width="80" height="80" rx="4"/><rect class="c-s1w" x="641" y="194" width="24" height="24" rx="3"/><rect class="c-s1w" x="667" y="194" width="24" height="24" rx="3"/><rect class="c-s1w" x="693" y="194" width="24" height="24" rx="3"/><rect class="c-s1w" x="641" y="220" width="24" height="24" rx="3"/><rect class="c-s1w" x="667" y="220" width="24" height="24" rx="3"/><rect class="c-s1w" x="693" y="220" width="24" height="24" rx="3"/><rect class="c-s1w" x="641" y="246" width="24" height="24" rx="3"/><rect class="c-s1w" x="667" y="246" width="24" height="24" rx="3"/><rect class="c-s1w" x="693" y="246" width="24" height="24" rx="3"/><rect class="backing" x="625" y="206" width="80" height="80" rx="4"/><rect class="c-s1w" x="627" y="208" width="24" height="24" rx="3"/><rect class="c-s1w" x="653" y="208" width="24" height="24" rx="3"/><rect class="c-s1w" x="679" y="208" width="24" height="24" rx="3"/><rect class="c-s1w" x="627" y="234" width="24" height="24" rx="3"/><rect class="c-s1w" x="653" y="234" width="24" height="24" rx="3"/><rect class="c-s1w" x="679" y="234" width="24" height="24" rx="3"/><rect class="c-s1w" x="627" y="260" width="24" height="24" rx="3"/><rect class="c-s1w" x="653" y="260" width="24" height="24" rx="3"/><rect class="c-s1w" x="679" y="260" width="24" height="24" rx="3"/><rect class="c-s1" x="34" y="393" width="14" height="14" rx="3"/><text class="s" x="56" y="404">Highlighted row = our <tspan class="code">sample_tensor</tspan>: a matrix with 1 row (sample) × 3 features → <tspan class="code">torch.Size([1, 3])</tspan></text>
</svg>
