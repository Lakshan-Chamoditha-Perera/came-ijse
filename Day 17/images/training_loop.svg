<svg xmlns="http://www.w3.org/2000/svg" width="900" height="736" viewBox="0 0 900 736" role="img" aria-labelledby="t d">
<title id="t">The training loop, block by block</title>
<desc id="d">Flow of the training cell. Block 1, Settings, runs once: num_epochs = 50, the loss histories, BEST_MODEL_PATH and best_val_loss = infinity. Then the epoch loop runs 50 times. Inside it: block 2, Start the epoch: model.train(), epoch_loss_sum = 0 and correct_predictions = 0. Block 3, the batch loop, runs 22 times per epoch and repeats five steps: zero_grad() clears old gradients, model() does the forward pass, loss_function() measures the loss, backward() computes gradients, step() updates all 41 weights; then the batch loss is added, correct predictions are counted and the batch line is printed in epochs 1 and 50. Block 4, Epoch summary: avg_train_loss and train_accuracy, stored in train_loss_history. Block 5, Validation: model.eval() and torch.no_grad(), then val_loss on 150 customers. Block 6, Save the best: if val_loss is below best_val_loss, torch.save(model.state_dict()). Block 7, Progress line: every 10th epoch, print the train, validation and best loss. An arrow loops back to block 2 for the next epoch. After 50 epochs, customer_predictor.pt holds the best weights and the summary cell prints the results.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --s1: #2a78d6; --s1-wash: rgba(42,120,214,0.08); --s1-chip: rgba(42,120,214,0.16);
    --s2: #eb6834; --s2-wash: rgba(235,104,52,0.06);
    --s3: #1baf7a; --s3-wash: rgba(27,175,122,0.14);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --s1: #3987e5; --s1-wash: rgba(57,135,229,0.12); --s1-chip: rgba(57,135,229,0.26);
      --s2: #d95926; --s2-wash: rgba(217,89,38,0.10);
      --s3: #199e70; --s3-wash: rgba(25,158,112,0.26);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 13.5px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 11.5px; fill: var(--ink-3); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; fill: var(--ink-1); }
  .lbl1 { font-size: 12.5px; font-weight: 700; fill: var(--s1); }
  .lbl2 { font-size: 12.5px; font-weight: 700; fill: var(--s2); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .save { fill: var(--s3-wash); }
  .epoch { fill: var(--s2-wash); stroke: var(--s2); stroke-width: 1.5; }
  .batch { fill: var(--s1-wash); stroke: var(--s1); stroke-width: 1.5; }
  .chip { fill: var(--s1-chip); }
  .badge circle { fill: var(--ink-2); }
  .badge text { fill: var(--surface); font-size: 11px; font-weight: 700; }
  .arrow { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .arrowhead { fill: var(--ink-3); }
  .loop1 { fill: none; stroke: var(--s1); stroke-width: 1.5; }
  .loop2 { fill: none; stroke: var(--s2); stroke-width: 1.5; }
  .head1 { fill: var(--s1); } .head2 { fill: var(--s2); }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="735" rx="12"/>
<text class="title" x="32" y="44" text-anchor="start">The training loop, block by block</text><text class="s" x="32" y="67" text-anchor="start">The numbers 1–7 match the block markers in the code cell (# === 1. Settings === and so on).</text><rect class="card" x="32" y="86" width="836" height="40" rx="8"/><g class="badge"><circle cx="52" cy="106" r="10"/><text x="52" y="110" text-anchor="middle">1</text></g><text class="h" x="70" y="111" text-anchor="start">Settings</text><text class="code" x="228" y="110" text-anchor="start">num_epochs = 50 · loss histories · BEST_MODEL_PATH · best_val_loss = inf</text><text class="m" x="860" y="111" text-anchor="end">once</text><line class="arrow" x1="450" y1="126" x2="450" y2="146"/><path class="arrowhead" d="M450 152 l-4 -7 h8 z"/><rect class="epoch" x="32" y="152" width="836" height="512" rx="12"/><text class="lbl2" x="48" y="174" text-anchor="start">for epoch_number in 1 … 50:   the epoch loop, 50 times</text><rect class="card" x="56" y="186" width="776" height="40" rx="8"/><g class="badge"><circle cx="76" cy="206" r="10"/><text x="76" y="210" text-anchor="middle">2</text></g><text class="h" x="94" y="211" text-anchor="start">Start the epoch</text><text class="code" x="252" y="210" text-anchor="start">model.train() · epoch_loss_sum = 0.0 · correct_predictions = 0</text><line class="arrow" x1="450" y1="226" x2="450" y2="240"/><path class="arrowhead" d="M450 246 l-4 -7 h8 z"/><rect class="batch" x="56" y="246" width="776" height="158" rx="10"/><g class="badge"><circle cx="76" cy="266" r="10"/><text x="76" y="270" text-anchor="middle">3</text></g><text class="lbl1" x="94" y="271" text-anchor="start">for each batch in train_loader:   the batch loop, 22 times per epoch</text><rect class="chip" x="72" y="288" width="128" height="50" rx="7"/><text class="code" x="136" y="309" text-anchor="middle">zero_grad()</text><text class="m" x="136" y="327" text-anchor="middle">clear old gradients</text><line class="loop1" x1="203" y1="313" x2="214" y2="313"/><path class="head1" d="M220 313 l-7 -4 v8 z"/><rect class="chip" x="222" y="288" width="128" height="50" rx="7"/><text class="code" x="286" y="309" text-anchor="middle">model(…)</text><text class="m" x="286" y="327" text-anchor="middle">forward pass</text><line class="loop1" x1="353" y1="313" x2="364" y2="313"/><path class="head1" d="M370 313 l-7 -4 v8 z"/><rect class="chip" x="372" y="288" width="128" height="50" rx="7"/><text class="code" x="436" y="309" text-anchor="middle">loss_function(…)</text><text class="m" x="436" y="327" text-anchor="middle">measure the loss</text><line class="loop1" x1="503" y1="313" x2="514" y2="313"/><path class="head1" d="M520 313 l-7 -4 v8 z"/><rect class="chip" x="522" y="288" width="128" height="50" rx="7"/><text class="code" x="586" y="309" text-anchor="middle">backward()</text><text class="m" x="586" y="327" text-anchor="middle">compute gradients</text><line class="loop1" x1="653" y1="313" x2="664" y2="313"/><path class="head1" d="M670 313 l-7 -4 v8 z"/><rect class="chip" x="672" y="288" width="128" height="50" rx="7"/><text class="code" x="736" y="309" text-anchor="middle">step()</text><text class="m" x="736" y="327" text-anchor="middle">update all 41 weights</text><path class="loop1" d="M736 340 V354 H136 V347"/><path class="head1" d="M136 341 l-4 7 h8 z"/><text class="m" x="450" y="368" text-anchor="middle">next batch</text><text class="s" x="72" y="390" text-anchor="start">Then: add the batch loss to epoch_loss_sum, count the correct predictions, print the batch line (epochs 1 and 50).</text><line class="arrow" x1="450" y1="404" x2="450" y2="418"/><path class="arrowhead" d="M450 424 l-4 -7 h8 z"/><rect class="card" x="56" y="424" width="776" height="40" rx="8"/><g class="badge"><circle cx="76" cy="444" r="10"/><text x="76" y="448" text-anchor="middle">4</text></g><text class="h" x="94" y="449" text-anchor="start">Epoch summary</text><text class="code" x="252" y="448" text-anchor="start">avg_train_loss · train_accuracy → train_loss_history</text><line class="arrow" x1="450" y1="464" x2="450" y2="478"/><path class="arrowhead" d="M450 484 l-4 -7 h8 z"/><rect class="card" x="56" y="484" width="776" height="40" rx="8"/><g class="badge"><circle cx="76" cy="504" r="10"/><text x="76" y="508" text-anchor="middle">5</text></g><text class="h" x="94" y="509" text-anchor="start">Validation</text><text class="code" x="252" y="508" text-anchor="start">model.eval() + torch.no_grad() → val_loss on 150 customers</text><line class="arrow" x1="450" y1="524" x2="450" y2="538"/><path class="arrowhead" d="M450 544 l-4 -7 h8 z"/><rect class="card" x="56" y="544" width="776" height="40" rx="8"/><rect class="save" x="56" y="544" width="776" height="40" rx="8"/><g class="badge"><circle cx="76" cy="564" r="10"/><text x="76" y="568" text-anchor="middle">6</text></g><text class="h" x="94" y="569" text-anchor="start">Save the best</text><text class="code" x="252" y="568" text-anchor="start">if val_loss &lt; best_val_loss: torch.save(model.state_dict(), …)</text><line class="arrow" x1="450" y1="584" x2="450" y2="598"/><path class="arrowhead" d="M450 604 l-4 -7 h8 z"/><rect class="card" x="56" y="604" width="776" height="40" rx="8"/><g class="badge"><circle cx="76" cy="624" r="10"/><text x="76" y="628" text-anchor="middle">7</text></g><text class="h" x="94" y="629" text-anchor="start">Progress line</text><text class="code" x="252" y="628" text-anchor="start">if epoch_number % 10 == 0: print train, val and best loss</text><path class="loop2" d="M832 624 H850 V206 H840"/><path class="head2" d="M833 206 l7 -4 v8 z"/><text class="lbl2" x="841" y="420" text-anchor="middle" dominant-baseline="central" transform="rotate(90 841 420)">next epoch</text><line class="arrow" x1="450" y1="664" x2="450" y2="678"/><path class="arrowhead" d="M450 684 l-4 -7 h8 z"/><rect class="card" x="32" y="684" width="836" height="40" rx="8"/><text class="h" x="52" y="709" text-anchor="start">After 50 epochs</text><text class="code" x="228" y="708" text-anchor="start">customer_predictor.pt holds the best weights · the summary cell prints the results</text>
</svg>
