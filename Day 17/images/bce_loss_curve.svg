<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
<title id="t">Binary cross-entropy loss curves</title>
<desc id="d">Line chart of the binary cross-entropy loss against the predicted probability p of label 1, from 0 to 1, with the loss axis cut at 4. The blue curve, true label 1, is minus log p: high when p is near 0 and close to 0 when p is near 1. The orange curve, true label 0, is minus log of 1 minus p: the mirror image. Marked points: 1, label 1 with p 0.9 gives loss 0.11, confident and right. 2, p 0.5 gives loss 0.69 (ln 2) on both curves, a 50/50 guess where an untrained model starts. 3, label 1 with p 0.1 gives loss 2.30, confident and wrong. Training lowers the average loss over all customers.</desc>
