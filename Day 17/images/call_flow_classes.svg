<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">Where model(x) finds each method</title>
<desc id="d">Class diagram. nn.Module, which inherits from object, defines __call__ (which is _wrapped_call_impl), _call_impl, __getattr__, a placeholder forward, and parameters(). CustomerPredictor and nn.Linear both inherit from nn.Module. Each defines its own __init__ and forward but no __call__, so model(x) and self.hidden(x) both find __call__ in nn.Module.</desc>
<style>
  svg {
    --surface: #fcfcfb; --border: rgba(11,11,11,0.10); --line: #e1e0d9;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781; --guide: #c3c2b7;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s0: #898781;
    --s1-wash: rgba(42,120,214,0.12); --s2-wash: rgba(235,104,52,0.14);
    --s3-wash: rgba(27,175,122,0.14); --s0-wash: rgba(137,135,129,0.16);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --border: rgba(255,255,255,0.10); --line: #33332f;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781; --guide: #4a4a46;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s0: #898781;
      --s1-wash: rgba(57,135,229,0.24); --s2-wash: rgba(217,89,38,0.26);
      --s3-wash: rgba(25,158,112,0.26); --s0-wash: rgba(137,135,129,0.24);
    }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
  .title { font-size: 19px; font-weight: 600; fill: var(--ink-1); }
  .h { font-size: 14px; font-weight: 600; fill: var(--ink-1); }
  .s { font-size: 13px; fill: var(--ink-2); }
  .m { font-size: 12px; fill: var(--ink-3); }
  .k { font-size: 12.5px; fill: var(--ink-2); }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; fill: var(--ink-2); }
  .codeb { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: var(--ink-1); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .f0 { fill: var(--s0); }
  .w1 { fill: var(--s1-wash); } .w2 { fill: var(--s2-wash); } .w3 { fill: var(--s3-wash); } .w0 { fill: var(--s0-wash); }
  .on-dark { fill: #ffffff; font-size: 13px; font-weight: 600; }
  .on-light { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
  .guide { fill: none; stroke: var(--guide); stroke-width: 1.5; }
  .arrow { fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  .arrowhead { fill: var(--ink-3); }
  .yes { fill: #0ca30c; font-weight: 700; } .no { fill: #d03b3b; font-weight: 700; }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="559" rx="12"/>
<text class="title" x="32" y="44" text-anchor="start">Where does each method come from?</text><text class="s" x="32" y="67" text-anchor="start">Python looks in the object's own class first, then in its parent classes (the MRO: method resolution order).</text><rect class="card" x="24" y="86" width="852" height="36" rx="10"/><text class="h" x="40" y="109" text-anchor="start">Colour key</text><rect class="f1" x="128" y="99" width="14" height="14" rx="3"/><text class="k" x="148" y="111" text-anchor="start">Your code</text><rect class="f2" x="228.95" y="99" width="14" height="14" rx="3"/><text class="k" x="248.95" y="111" text-anchor="start">Inherited from nn.Module</text><rect class="f3" x="428.15" y="99" width="14" height="14" rx="3"/><text class="k" x="448.15" y="111" text-anchor="start">nn.Linear's own method</text><rect class="card" x="400" y="140" width="100" height="28" rx="8"/><text class="code" x="450" y="159" text-anchor="middle">object</text><rect class="card" x="270" y="196" width="360" height="145" rx="10"/><path class="f2" d="M270 226 V206 a10 10 0 0 1 10 -10 H620 a10 10 0 0 1 10 10 V226 Z"/><text class="on-light" x="284" y="216" text-anchor="start">nn.Module   (the parent class)</text><text class="code" x="284" y="247" text-anchor="start">__call__</text><text class="m" x="616" y="247" text-anchor="end">= _wrapped_call_impl</text><text class="code" x="284" y="268" text-anchor="start">_call_impl</text><text class="m" x="616" y="268" text-anchor="end">runs hooks, then forward</text><text class="code" x="284" y="289" text-anchor="start">__getattr__</text><text class="m" x="616" y="289" text-anchor="end">finds layers and parameters</text><text class="code" x="284" y="310" text-anchor="start">forward</text><text class="m" x="616" y="310" text-anchor="end">placeholder: raises an error</text><text class="code" x="284" y="331" text-anchor="start">parameters(), named_parameters(), ...</text><line class="arrow" x1="450" y1="196" x2="450" y2="176"/><path class="arrowhead" d="M450 168 l-4.5 8 h9 z"/><rect class="card" x="40" y="391" width="320" height="103" rx="10"/><path class="f1" d="M40 421 V401 a10 10 0 0 1 10 -10 H350 a10 10 0 0 1 10 10 V421 Z"/><text class="on-dark" x="54" y="411" text-anchor="start">CustomerPredictor   (your class)</text><text class="code" x="54" y="442" text-anchor="start">__init__</text><text class="yes" x="346" y="442" text-anchor="end">✓</text><text class="m" x="330" y="442" text-anchor="end">creates the layers</text><text class="code" x="54" y="463" text-anchor="start">forward</text><text class="yes" x="346" y="463" text-anchor="end">✓</text><text class="m" x="330" y="463" text-anchor="end">your 3 lines</text><text class="code" x="54" y="484" text-anchor="start">__call__</text><text class="no" x="346" y="484" text-anchor="end">✗</text><text class="m" x="330" y="484" text-anchor="end">not here: use the parent's</text><rect class="card" x="540" y="391" width="320" height="103" rx="10"/><path class="f3" d="M540 421 V401 a10 10 0 0 1 10 -10 H850 a10 10 0 0 1 10 10 V421 Z"/><text class="on-light" x="554" y="411" text-anchor="start">nn.Linear</text><text class="code" x="554" y="442" text-anchor="start">__init__</text><text class="yes" x="846" y="442" text-anchor="end">✓</text><text class="m" x="830" y="442" text-anchor="end">creates weight and bias</text><text class="code" x="554" y="463" text-anchor="start">forward</text><text class="yes" x="846" y="463" text-anchor="end">✓</text><text class="m" x="830" y="463" text-anchor="end">F.linear(input, w, b)</text><text class="code" x="554" y="484" text-anchor="start">__call__</text><text class="no" x="846" y="484" text-anchor="end">✗</text><text class="m" x="830" y="484" text-anchor="end">not here: use the parent's</text><path class="arrow" d="M200 391 V366 H420 V349"/><path class="arrowhead" d="M420 341 l-4.5 8 h9 z"/><path class="arrow" d="M700 391 V366 H480 V349"/><path class="arrowhead" d="M480 341 l-4.5 8 h9 z"/><text class="m" x="310" y="360" text-anchor="middle">inherits from</text><text class="m" x="590" y="360" text-anchor="middle">inherits from</text><text class="h" x="40" y="214" text-anchor="start">model(x)</text><text class="s" x="40" y="236" text-anchor="start">1. look for __call__ in</text><text class="s" x="40" y="254" text-anchor="start">    CustomerPredictor</text><text class="s" x="40" y="274" text-anchor="start">2. not found, go up to nn.Module</text><text class="s" x="40" y="294" text-anchor="start">3. found: run nn.Module.__call__</text><text class="h" x="660" y="214" text-anchor="start">self.hidden(x)</text><text class="s" x="660" y="236" text-anchor="start">1. look in nn.Linear</text><text class="s" x="660" y="256" text-anchor="start">2. not found, go up</text><text class="s" x="660" y="276" text-anchor="start">3. run nn.Module.__call__</text><text class="s" x="32" y="542" text-anchor="start">Both classes override forward, so _call_impl's call to self.forward runs the child's own version, not the placeholder in nn.Module.</text>
</svg>
