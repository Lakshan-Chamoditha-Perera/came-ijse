<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="t d">
<title id="t">Day 18 Part 2 roadmap: tuning XGBoost with Optuna and MLflow</title>
<desc id="d">Six stages. Stage 1, sections 1 to 4, MLflow: create the experiment with mlflow.set_experiment. Stage 2, section 5, scikit-learn: split 569 tumours into 398 training, 85 validation and 86 test rows. Stage 3, section 6, Optuna: define the objective function, which picks 6 hyperparameters, trains on the training set and returns the validation log loss. Stage 4, sections 7 to 8, Optuna: run the study for 30 trials; the best is trial 23 with validation log loss 0.0208; the final model scores test accuracy 0.9186. Stage 5, section 9, MLflow: view the results, one parent run holding 30 child runs. Stage 6, sections 10 to 11, MLflow: register the best model as breast-cancer-xgboost version 1 with the alias champion.</desc>
<style>
